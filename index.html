<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LONG LEGS - YouTube Playable</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #f4f4f0;
    color: #111111;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  #ui {
    position: fixed;
    inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .header-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 20px 24px;
    width: 100%;
  }
  .score-container {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  #score {
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 2px;
    line-height: 1;
  }
  #bestScore {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    opacity: 0.55;
  }
  #difficulty {
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 1.2px;
    opacity: 0.72;
  }
  #audioBtn {
    pointer-events: auto;
    background: none;
    border: 2px solid #111111;
    color: #111111;
    padding: 8px 12px;
    font-weight: 800;
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 4px;
    transition: background 0.15s, color 0.15s;
  }
  .header-actions {
    display: flex;
    gap: 8px;
  }
  #pauseBtn {
    pointer-events: auto;
    background: none;
    border: 2px solid #111111;
    color: #111111;
    padding: 8px 12px;
    font-weight: 800;
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 4px;
  }
  #pauseBtn:disabled { opacity: 0.4; cursor: default; }
  #audioBtn:hover {
    background: #111111;
    color: #f4f4f0;
  }
  #hint {
    position: absolute;
    left: 50%;
    top: 76px;
    transform: translateX(-50%);
    max-width: calc(100% - 32px);
    padding: 8px 12px;
    background: rgba(244, 244, 240, 0.82);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1.2px;
    opacity: 0.6;
    text-align: center;
    pointer-events: none;
    white-space: normal;
  }
  body.game-over .header-bar,
  body.game-over #hint {
    visibility: hidden;
  }
  body.compact-fail .header-bar,
  body.compact-fail #hint {
    visibility: visible;
  }
  body.compact-fail #overlay {
    inset: 18% auto auto 50%;
    width: max-content;
    max-width: calc(100% - 28px);
    height: auto;
    transform: translate(-50%, 0);
    background: transparent;
    backdrop-filter: none;
    pointer-events: none;
  }
  body.compact-fail .card {
    width: auto;
    max-width: 360px;
    padding: 18px 22px;
    border: 2px solid #111;
    background: rgba(244, 244, 240, 0.94);
    pointer-events: auto;
  }
  body.compact-fail h1 {
    margin: 0 0 8px;
    font-size: 30px;
    line-height: 1;
    letter-spacing: -1px;
  }
  body.compact-fail .subtitle { margin-bottom: 6px; font-size: 13px; }
  body.compact-fail p { font-size: 10px; }
  body.compact-fail button.primary-btn {
    margin-top: 10px;
    padding: 10px 18px;
    font-size: 14px;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(244, 244, 240, 0.98);
    pointer-events: auto;
    backdrop-filter: blur(4px);
    transition: opacity 0.2s ease;
  }
  .card {
    text-align: center;
    padding: 40px;
    max-width: 400px;
    width: 90%;
  }
  h1 {
    font-size: 64px;
    line-height: 0.85;
    margin: 0 0 16px;
    letter-spacing: -4px;
    font-weight: 900;
  }
  .subtitle {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 12px;
  }
  p {
    margin: 6px 0;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .small {
    font-size: 12px;
    opacity: 0.65;
    letter-spacing: 1px;
  }
  button.primary-btn {
    margin-top: 24px;
    border: 3px solid #111111;
    background: #111111;
    color: #ffffff;
    padding: 16px 36px;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 3px;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease;
  }
  button.primary-btn:active {
    transform: scale(0.96);
  }
  .name-input {
    display: block;
    width: min(280px, 100%);
    margin: 18px auto 0;
    padding: 12px 14px;
    border: 2px solid #111;
    background: transparent;
    color: #111;
    font: inherit;
    font-weight: 700;
    text-align: center;
    user-select: text;
    -webkit-user-select: text;
  }
  .secondary-btn {
    margin: 18px 8px 0;
    padding: 12px 18px;
    border: 2px solid #111;
    background: transparent;
    color: #111;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 1px;
    cursor: pointer;
  }
  .hidden {
    display: none !important;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div class="header-bar">
    <div class="score-container">
      <div id="score">0 m</div>
      <div id="bestScore">BEST 0 m</div>
      <div id="difficulty">EASY · 0</div>
    </div>
    <div class="header-actions">
      <button id="pauseBtn" disabled>PAUSE</button>
      <button id="audioBtn">AUDIO: ON</button>
    </div>
  </div>
  <div id="hint">HOLD SPACE TO STRETCH</div>
  <div id="overlay">
    <div class="card" id="cardContent">
      <h1>LONG<br>LEGS</h1>
      <div class="subtitle">WALK. STRETCH. SURVIVE.</div>
      <p class="small" id="controlHint">HOLD TO STRETCH · RELEASE ON NARROW PLATFORMS</p>
      <button class="primary-btn" id="startBtn">START</button>
    </div>
  </div>
</div>
<script src="./game.js"></script>
</body>
</html>
